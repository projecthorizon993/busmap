name: Build Android APK

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_TRANSIT_PROVIDER: vietnam
      VITE_VIETNAM_API_BASE: http://timbus.vn
      VITE_VINBUS_API_BASE: https://vbservice-api.vinbus.vn
      VITE_VINBUS_TILE_BASE: https://vbcore-maptile-web.vinbus.vn
      VITE_VINBUS_DECRYPT_KEY: ${{ secrets.VINBUS_DECRYPT_KEY }}
      VITE_VINBUS_DEFAULT_REGION: hcm
      VITE_VINBUS_TIMEOUT_MS: 15000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 36

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: busmap-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
